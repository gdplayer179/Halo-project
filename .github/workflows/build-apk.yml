name: Build Halo Pulse APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'InfinixHaloPulse_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download project from repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip application project
        run: unzip -q InfinixHaloPulse_project.zip -d .

      - name: Build installable debug APK
        working-directory: InfinixHaloPulse
        
run: sed -i 's/android.R.drawable.ic_menu_info/android.R.drawable.ic_dialog_info/g' app/src/main/java/com/example/halopulse/MainActivity.java && gradle --no-daemon assembleDebug
      - name: Make APK available directly
        uses: actions/upload-artifact@v7
        with:
          path: InfinixHaloPulse/app/build/outputs/apk/debug/app-debug.apk
          archive: 'false'
          retention-days: 7
